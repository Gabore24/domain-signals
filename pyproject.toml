[project]
name = "domain-signals"
version = "0.1.0"
description = "Collects public technical signals about a domain (DNS, TLS, HTTP)."
readme = "README.md"
authors = [
    { name = "Gábor Farkas" }
]
requires-python = ">=3.12"
dependencies = [
    "certifi>=2024.8.30",
    "dnspython>=2.9.2",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
domain-signals = "domain_signals.app:run"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
